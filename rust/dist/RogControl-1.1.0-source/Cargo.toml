[package]
name = "rogcontrol"
version = "1.1.0"
edition = "2021"
description = "ASUS DisplayWidget Center reconstruction in Rust/egui: DDC/CI widget + full control panel."

[dependencies]
eframe = "0.29"
egui = "0.29"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_UI_Controls_Dialogs",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
tray-icon = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.52"
fontdue = "0.9"
raw-window-handle = "0.6"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
